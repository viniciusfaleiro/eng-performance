<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eng Performance — Echo (harness)</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
    <!-- Material Design 3 web components, vendored and served by this service -->
    <script type="module" th:src="@{/vendor/md3.js}" src="/vendor/md3.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <span class="brand">Eng Performance</span>
        <span class="tag">harness · echo</span>
      </header>

      <section class="card">
        <h1 class="md-typescale-headline-small">Echo test</h1>
        <p class="md-typescale-body-medium subtitle">
          Fatia mínima que exercita todo o harness (hexagonal → REST → MD3). O backend real vem
          depois.
        </p>

        <form id="echo-form" class="form" onsubmit="return false;">
          <md-outlined-text-field
            id="message"
            label="Mensagem"
            value="olá, harness"
            maxlength="280"
          ></md-outlined-text-field>
          <md-filled-button id="send" type="button">Enviar</md-filled-button>
        </form>

        <div id="result" class="result" hidden>
          <span class="result-seq" id="result-seq"></span>
          <span class="result-text md-typescale-body-large" id="result-text"></span>
        </div>
        <div id="error" class="error" hidden></div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);

      async function sendEcho() {
        const field = $("message");
        const message = (field.value || "").trim();
        const result = $("result");
        const error = $("error");
        result.hidden = true;
        error.hidden = true;

        try {
          const res = await fetch(
            "/api/echo?message=" + encodeURIComponent(message)
          );
          const body = await res.json();
          if (!res.ok) {
            error.textContent = body.error || "erro inesperado";
            error.hidden = false;
            return;
          }
          $("result-seq").textContent = "#" + body.sequence;
          $("result-text").textContent = body.text;
          result.hidden = false;
        } catch (e) {
          error.textContent = "falha de rede: " + e;
          error.hidden = false;
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        $("send").addEventListener("click", sendEcho);
      });
    </script>
  </body>
</html>
