# Local environment. Two ways to use it:
#   docker compose up -d db                 # just Postgres, then ./gradlew :bootstrap:bootRun
#   ./scripts/run-local.sh                  # build the image + run db AND the app (profile "full")
services:
  db:
    image: postgres:16-alpine
    container_name: engperf-db
    environment:
      POSTGRES_DB: engperf
      POSTGRES_USER: engperf
      POSTGRES_PASSWORD: engperf
    ports:
      - "5432:5432"
    volumes:
      - engperf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engperf -d engperf"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The app in a container. Behind the "full" profile so `docker compose up -d db` stays db-only.
  # Build its image first with ./scripts/run-local.sh (which also starts this).
  app:
    image: eng-performance:local
    container_name: engperf-app
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/engperf
      DB_USERNAME: engperf
      DB_PASSWORD: engperf
    ports:
      - "8080:8080"

volumes:
  engperf-pgdata:
